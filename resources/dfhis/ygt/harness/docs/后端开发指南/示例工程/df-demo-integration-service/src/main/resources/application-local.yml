# ==============================================================
# df-demo-integration-service 本地开发环境配置（profile: local）
#
# 需先执行 docker compose up -d 启动 Redis 和 RabbitMQ。
# 生产/预发环境的等效配置请参考 nacos-examples/ 目录。
# ==============================================================
spring:
  data:
    redis:
      host: localhost
      port: 6379
      # 本地 Redis 无密码；生产通过 Nacos 注入
      # password: your-redis-password
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

df:
  security:
    jwt:
      issuer: df-ygt
      # 本地开发占位密钥，生产必须通过 Nacos 注入真实密钥
      secret: change-me-before-production-change-me-before-production
      expiration: 2h
  message:
    rabbit:
      management:
        enabled: true
        base-url: http://localhost:15672
        username: guest
        password: guest
        vhost: /
